spring.application.name=active

# Expose only non-sensitive actuator endpoints by default
management.endpoints.web.exposure.include=health,info
management.info.build.enabled=false

# Virtual threads tuning
spring.threads.virtual.enabled=true
server.tomcat.virtual-threads.enabled=true

# PostgreSQL connection from environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true

workos.api-key=${WORKOS_API_KEY}
workos.client-id=${WORKOS_CLIENT_ID}

# CORS - use explicit origins for web (enables credentials), or * for native only
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Cookie configuration for web platform
# For cross-site requests, use SameSite=None with Secure=true
cookie.secure=${COOKIE_SECURE:true}
cookie.same-site=${COOKIE_SAME_SITE:None}

# Logging: include request MDC context for easier tracing
logging.level.root=WARN
logging.level.com.services.active=DEBUG
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} requestId=%X{requestId:-na} method=%X{httpMethod:-na} path=%X{httpPath:-na} platform=%X{clientPlatform:-na} - %msg%n
