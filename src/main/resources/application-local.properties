spring.application.name=active

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/activedb
spring.datasource.username=admin
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true

jwt.secret=really_long_secret_key_for_jwt_tokens_1234567890_even_longer
management.endpoints.web.exposure.include=health,info
management.info.build.enabled=false

# Enable virtual threads for Spring and Tomcat
spring.threads.virtual.enabled=true
server.tomcat.virtual-threads.enabled=true

# Autoload exercises in local by default
active.exercises.autoload=true

workos.client-id=${WORKOS_CLIENT_ID}
workos.api-key=${WORKOS_API_KEY}

# CORS configuration - use explicit origins for web with credentials, or * for native only
# For web clients, use comma-separated explicit origins (enables credentials/cookies)
# cors.allowed-origins=http://localhost:3000,https://your-domain.com
# For native clients only, use * (credentials disabled)
cors.allowed-origins=*

# Cookie configuration for web platform
# For cross-site requests (e.g., localhost -> ngrok), use SameSite=None with Secure=true
# SameSite=None requires Secure=true (ngrok provides HTTPS)
cookie.secure=true
cookie.same-site=None
