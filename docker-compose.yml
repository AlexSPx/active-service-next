version: '3.8'

services:
  # Your Java application
  java-app:
    build: .  # Assumes Dockerfile is in current directory
    # Or use: image: your-java-app:latest
    ports:
      - "${APP_PORT}:8080"
    environment:
      # Spring Boot PostgreSQL configuration using environment variables
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  # PostgreSQL service
  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Persistent data storage - this prevents data loss on restarts
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

# Named volumes for persistent storage
volumes:
  postgres_data:
    driver: local

# Custom network for container communication
networks:
  app-network:
    driver: bridge