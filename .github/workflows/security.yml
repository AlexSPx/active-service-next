name: Security Scan

on:
  workflow_call:

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Trivy dependency and filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0.0
        with:
          scan-type: 'fs'
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1